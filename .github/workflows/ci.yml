name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Love2D and Dependencies
      run: |
        sudo add-apt-repository ppa:bartbes/love-stable -y
        sudo apt-get update
        sudo apt-get install -y love xvfb

    - name: Verify compilation and initialization
      run: |
        xvfb-run love . --ci
