name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Love2D and Dependencies
      run: |
        sudo add-apt-repository ppa:bartbes/love-stable -y
        sudo apt-get update
        sudo apt-get install -y love xvfb

    - name: Run the test suite
      run: |
        love . --test

    - name: Verify compilation and initialization
      run: |
        xvfb-run love . --ci --autoplay --ticks 3000 --seed 1

    - name: Verify the networked game through the local server
      run: |
        xvfb-run love . --autostart --autoplay --frames 3000

    - name: Lua Diagnostics (LuaLS)
      uses: mrcjkb/lua-typecheck-action@v0
      with:
        configpath: ".luarc.json"


