name: Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb unzip

    - name: Build Windows, macOS and Linux packages
      run: |
        xvfb-run make build
        ls -la dist/*/

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: Athena-windows
        path: dist/*/Athena-windows.zip

    - name: Upload macOS build
      uses: actions/upload-artifact@v4
      with:
        name: Athena-macos
        path: dist/*/Athena-macos.zip

    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: Athena-linux
        path: dist/*/Athena-linux.zip

    - name: Upload LOVE file
      uses: actions/upload-artifact@v4
      with:
        name: Athena-love
        path: dist/*/Athena.love

    - name: Publish the release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*/Athena-windows.zip
          dist/*/Athena-macos.zip
          dist/*/Athena-linux.zip
          dist/*/Athena.love
